app.env=${APP_ENV:production}
app.frontend-url=${FRONTEND_URL}
app.oauth2-success-url=${OAUTH2_SUCCESS_URL:${FRONTEND_URL}/oauth2/success}
app.public-domain=${PUBLIC_DOMAIN}
app.cookie-secure=${APP_COOKIE_SECURE:true}
app.cookie-same-site=${APP_COOKIE_SAME_SITE:None}
app.init.enabled=${APP_INIT_ENABLED:false}
app.init.admin-password=${APP_INIT_ADMIN_PASSWORD:}
app.init.demo-password=${APP_INIT_DEMO_PASSWORD:}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

jwt.secret=${JWT_SECRET:}

cors.allowed-origins=${ALLOWED_ORIGINS:${FRONTEND_URL}}

spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

ghn.webhook-secret=${GHN_WEBHOOK_SECRET:}

vnpay.paymentUrl=${VNPAY_PAYMENT_URL:}
vnpay.returnUrl=${VNPAY_RETURN_URL:${PUBLIC_DOMAIN}/api/payment/vnpay-callback}
vnpay.ipnUrl=${VNPAY_IPN_URL:${PUBLIC_DOMAIN}/api/payment/vnpay-ipn}
vnpay.refundUrl=${VNPAY_REFUND_URL:}
